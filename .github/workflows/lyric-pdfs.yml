name: Build lyric sheet PDFs
on:
  push:
    branches: [main]
    paths:
      - 'generate_lyric_pdfs.py'
      - '*/lyrics.html'
      - '.github/workflows/lyric-pdfs.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install reportlab
      - run: python generate_lyric_pdfs.py
      - name: Commit PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add this-christmas/lyrics.pdf hark-the-herald-angels-sing/lyrics.pdf mary-did-you-know/lyrics.pdf
          git diff --cached --quiet || (git commit -m "Generate lyric sheet PDFs" && git push)
