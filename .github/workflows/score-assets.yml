name: Build scores and rehearsal audio
on:
  push:
    branches: [main]
    paths:
      - '*/*-sab.ly'
      - 'build_rehearsal_assets.py'
      - 'generate_score_previews.py'
      - '.github/workflows/score-assets.yml'
      - 'all-i-want-for-christmas-is-you/build_a_cappella.py'
      - 'swing_playback.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: choir-score-assets
  cancel-in-progress: true
jobs:
  scores:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install engraving and audio tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lilypond fluidsynth fluid-soundfont-gm ffmpeg
          python -m pip install mido==1.3.3 PyMuPDF==1.26.6
      - name: Rebuild all scores, audio, and inline pages
        run: |
          python build_rehearsal_assets.py
          python all-i-want-for-christmas-is-you/build_a_cappella.py
      - name: Commit matching rehearsal assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*/*-sab.pdf' '*/*-a-cappella.pdf' '*/*.mp3' '*/*.musicxml' '*/score-pages/*.svg' '*/index.html'
          if ! git diff --cached --quiet; then
            git commit -m "Build matching rehearsal assets"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
