name: Build scores and rehearsal audio
on:
  push:
    branches: [main]
    paths:
      - '*/*-sab.ly'
      - 'build_rehearsal_assets.py'
      - 'generate_score_previews.py'
      - '.github/workflows/score-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: choir-score-assets
  cancel-in-progress: false
jobs:
  scores:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install engraving and audio tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lilypond fluidsynth fluid-soundfont-gm ffmpeg
          python -m pip install mido PyMuPDF
      - name: Rebuild all scores, audio, and inline pages
        run: python build_rehearsal_assets.py
      - name: Commit matching rehearsal assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*/*-sab.pdf' '*/*.mp3' '*/*.musicxml' '*/score-pages/*.svg' '*/index.html'
          if ! git diff --cached --quiet; then
            git commit -m "Rebuild scores and clarinet rehearsal tracks after piano harmony review"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
